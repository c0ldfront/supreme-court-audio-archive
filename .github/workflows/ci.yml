name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.11'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
      - name: Verify installed CLI and bundled template
        run: |
          uv venv /tmp/scotus-installed
          uv pip install --python /tmp/scotus-installed/bin/python dist/*.whl
          cd /tmp
          /tmp/scotus-installed/bin/scotus-pipeline init-config smoke-case.toml
          /tmp/scotus-installed/bin/scotus-pipeline validate smoke-case.toml
          /tmp/scotus-installed/bin/scotus-pipeline run smoke-case.toml --dry-run
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
