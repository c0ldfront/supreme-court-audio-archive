[project]
name = "supreme-court-ingest"
version = "0.1.0"
description = "Archive and analyze U.S. Supreme Court oral argument audio."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
audio = [
  "pyannote.audio>=4.0.0",
  "torch~=2.11.0",
  "torchaudio~=2.11.0",
  "torchcodec~=0.11.1",
  "torchvision~=0.26.0",
  "whisperx @ git+https://github.com/m-bain/whisperX.git",
]

dev = [
  "ruff>=0.14.0",
]

[tool.uv]
default-groups = []
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
  "torch>=2.11.0,<2.12.dev0",
  "torchaudio>=2.11.0,<2.12.dev0",
  "torchcodec>=0.11.1,<0.12.dev0",
  "torchvision>=0.26.0,<0.27.dev0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
