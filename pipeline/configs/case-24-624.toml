[project]
name = "case-24-624"
workspace = "../.."

[case]
docket = "24-624"
term = [2025]

[paths]
courts_dir = ".courts"
output_dir = "output"

[steps]
archive = true
extract_transcript = true
build_timeline = true
run_alignment = true
merge_alignment = true
align_official_words = true
refine_speech_gaps = true
build_profiles = true
build_viewer = true
apply_qa_markers = false

[archive]
include_transcripts = true
overwrite = false
rate_limit_seconds = 0.5
retries = 3
timeout_seconds = 60

[alignment]
enabled = true
chunk_seconds = 300.0
workers = 1
model_size = "tiny.en"
max_bad_ratio = 0.5
stop_on_warning = false
overwrite = false

[official_words]
method = "asr"
overwrite = false
apply_low_quality = false
progress_every = 5

[qa]
enabled = false
markers = []
enforce_order = false
min_order_gap = 0.0

[runtime]
resume = true
max_retries = 0
quiet = false

[[notifications]]
type = "console"
level = "info"

[[notifications]]
type = "jsonl"
level = "debug"
path = ".courts/runs/{case}/events.jsonl"
