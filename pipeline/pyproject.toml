[project]
name = "scotus-pipeline"
version = "0.1.0"
readme = "README.md"
description = "Typed, configurable Supreme Court case processing pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "rich>=13.9",
]

[project.optional-dependencies]
asr = [
  "torch>=2.2",
  "whisperx>=3.3",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
]

[project.scripts]
scotus-pipeline = "scotus_pipeline.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/scotus_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
