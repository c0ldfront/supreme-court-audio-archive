[project]
name = "scotus-pipeline-v2"
version = "0.1.0"
description = "Typed, configurable Supreme Court case processing pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "rich>=13.9",
]

[project.scripts]
scotus-pipeline = "scotus_pipeline.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.hatch.build.targets.wheel]
packages = ["src/scotus_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
